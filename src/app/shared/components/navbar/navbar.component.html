<nav class="navbar" aria-label="Main navigation">
  <div class="navbar-inner">
    <a routerLink="/" (click)="closeMenu()" class="navbar-brand">
      <img src="./assets/images/logo.svg" alt="" width="32" height="32" />
      <span>{{ appTitle }}</span>
    </a>
    <button
      #menuToggle
      (click)="toggleMenu()"
      type="button"
      class="navbar-toggle"
      aria-controls="main-navbar"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span class="sr-only">{{
        isMenuOpen() ? "Close menu" : "Open menu"
      }}</span>
      <svg
        aria-hidden="true"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        @if (isMenuOpen()) {
          <path d="m6 6 12 12M6 18 18 6" />
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
    <div class="navbar-menu" [class.is-open]="isMenuOpen()" id="main-navbar">
      <div class="navbar-menu-content">
        <ul class="navbar-links">
          @for (link of navbarLinks; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                (click)="closeMenu()"
                class="navbar-link"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                >{{ link.label }}</a
              >
            </li>
          }
        </ul>
        <a
          routerLink="/search"
          (click)="closeMenu()"
          class="navbar-search"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          <svg
            aria-hidden="true"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 4 4" />
          </svg>
          <span class="md:sr-only">Search</span>
        </a>
      </div>
    </div>
  </div>
</nav>
