name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Create production configuration
        env:
          # Store the plain TMDB v3 API key in this repository secret.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const key = process.env.TMDB_API_KEY?.trim();
          if (!key) {
            throw new Error('Configure the TMDB_API_KEY repository secret before deploying.');
          }
          const config = {
            production: true,
            theMovieDBURL: 'https://api.themoviedb.org/3',
            theMovieDBAPIKey: key,
          };
          writeFileSync('src/environments/environment.ts',
            `export const environment = ${JSON.stringify(config)};\n`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build-gh-page -- --base-href "${PAGES_BASE_PATH}/"
      - name: Prepare fallback for Angular routes
        run: cp dist/cinemaze/browser/index.html dist/cinemaze/browser/404.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/cinemaze/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
